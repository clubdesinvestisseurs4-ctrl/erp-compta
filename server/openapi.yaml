            schema: { $ref: '#/components/schemas/BonCommandeUpdateRequest' }
      responses:
        '200':
          description: Bon de commande mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Seuls les bons en brouillon peuvent être modifiés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteApiCommandesBySocieteIdAndId
      tags: [Achats]
      summary: Supprime un bon de commande en brouillon
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Bon de commande supprimé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Seuls les bons en brouillon peuvent être supprimés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/commandes/{societeId}/{id}/valider:
    post:
      operationId: postApiCommandesBySocieteIdAndIdValider
      tags: [Achats]
      summary: "Confirme le bon de commande (aucune écriture comptable : pas encore de dette)"
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Bon de commande validé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ce bon de commande a déjà été validé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/commandes/{societeId}/{id}/recevoir:
    post:
      operationId: postApiCommandesBySocieteIdAndIdRecevoir
      tags: [Achats]
      summary: Comptabilise la réception (débit comptes de charge / crédit 401 fournisseur)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date, description: Défaut = aujourd'hui }
      responses:
        '200':
          description: Réception comptabilisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400':
          description: Échec de création de l'écriture (voir la section "Écritures comptables")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Le bon de commande doit être validé avant la réception
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/commandes/{societeId}/{id}/payer:
    post:
      operationId: postApiCommandesBySocieteIdAndIdPayer
      tags: [Achats]
      summary: Comptabilise le paiement (débit 401 fournisseur / crédit trésorerie)
      description: Le journal (Caisse `CA` ou Banque `BQ`) est déduit automatiquement selon que `compteTresorerie` commence par `57`.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compteTresorerie]
              properties:
                compteTresorerie: { type: string, example: '521' }
                date: { type: string, format: date, description: Défaut = aujourd'hui }
      responses:
        '200':
          description: Paiement comptabilisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Le bon de commande doit être reçu avant le paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Clôture ───────────────────────────────────────────
  /api/cloture/{societeId}/simuler:
    get:
      operationId: getApiClotureBySocieteIdSimuler
      tags: [Clôture]
      summary: Aperçu de la clôture d'exercice, sans aucune écriture en base
      description: |
        Calcule les lignes de détermination du résultat (soldes des comptes de classes 6/7)
        et les à-nouveaux (soldes des comptes de classes 1 à 5) qui seraient générés par
        `POST /executer`, sans rien écrire.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Aperçu de clôture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClotureApercu' }
        '400':
          description: exercice manquant, société introuvable, exercice déjà clôturé, ou à-nouveaux calculés déséquilibrés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/cloture/{societeId}/executer:
    post:
      operationId: postApiClotureBySocieteIdExecuter
      tags: [Clôture]
      summary: Clôture réelle et irréversible de l'exercice (admin uniquement)
      description: |
        Crée l'écriture de détermination du résultat (journal `OD`, si au moins 2 lignes),
        crée l'écriture des à-nouveaux sur l'exercice suivant (journal `AN`, si au moins 2
        lignes), ajoute l'exercice à `exercicesClotures` de la société et avance
        `exerciceCourant` si nécessaire.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exercice]
              properties:
                exercice: { type: integer }
      responses:
        '200':
          description: Exercice clôturé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClotureResultat' }
        '400':
          description: exercice manquant, société introuvable, exercice déjà clôturé, ou à-nouveaux calculés déséquilibrés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Accès refusé (rôle `admin` requis, ou hors accès société)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Lettrage ──────────────────────────────────────────
  /api/lettrage/{societeId}/{compte}:
    get:
      operationId: getApiLettrageBySocieteIdAndCompte
      tags: [Lettrage]
      summary: Tous les mouvements du compte, lettrés et non lettrés
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
      responses:
        '200':
          description: Mouvements du compte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MouvementLettrage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiLettrageBySocieteIdAndCompte
      tags: [Lettrage]
      summary: Lettrage manuel d'une sélection de mouvements équilibrée
      description: |
        Purement déclaratif — ne modifie ni le débit/crédit ni le compte d'une ligne, donc
        reste autorisé même sur un exercice clôturé. Au moins 2 mouvements requis, dont la
        somme débit − crédit doit être exactement nulle.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mouvements]
              properties:
                mouvements:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    required: [ecritureId, ligneIndex]
                    properties:
                      ecritureId: { type: string }
                      ligneIndex: { type: integer }
      responses:
        '200':
          description: Lettre attribuée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  lettre: { type: string, example: A }
        '400':
          description: Moins de 2 mouvements, ligne invalide, ou sélection déséquilibrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Une des écritures référencées est introuvable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Une ligne de la sélection est déjà lettrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/lettrage/{societeId}/{compte}/auto:
    post:
      operationId: postApiLettrageBySocieteIdAndCompteAuto
      tags: [Lettrage]
      summary: Lettrage automatique des correspondances exactes 1 pour 1
      description: Recherche, parmi les mouvements non lettrés, les paires débit/crédit de montant strictement identique.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
      responses:
        '200':
          description: Lettrages automatiques effectués
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  nbLettrages: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/lettrage/{societeId}/{compte}/{lettre}:
    delete:
      operationId: deleteApiLettrageBySocieteIdAndCompteAndLettre
      tags: [Lettrage]
      summary: Annule un lettrage (les écritures elles-mêmes ne sont pas touchées)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
        - name: lettre
          in: path
          required: true
          schema: { type: string, example: A }
      responses:
        '200':
          description: Lettrage annulé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Ventes ────────────────────────────────────────────
  /api/factures/{societeId}:
    get:
      operationId: getApiFacturesBySocieteId
      tags: [Ventes]
      summary: Factures de vente de la société
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: statut
          in: query
          schema: { $ref: '#/components/schemas/StatutFactureVente' }
      responses:
        '200':
          description: Liste des factures de vente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FactureVente' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiFacturesBySocieteId
      tags: [Ventes]
      summary: Crée une facture de vente en brouillon
      description: Aucune écriture comptable n'est générée à la création — voir `POST /{id}/facturer`.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactureVenteCreateRequest' }
      responses:
        '201':
          description: Facture créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactureVente' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/factures/{societeId}/{id}:
    get:
      operationId: getApiFacturesBySocieteIdAndId
      tags: [Ventes]
      summary: Détail d'une facture de vente
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Facture de vente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FactureVente' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putApiFacturesBySocieteIdAndId
      tags: [Ventes]
      summary: Modifie une facture en brouillon
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FactureVenteUpdateRequest' }
      responses:
        '200':
          description: Facture mise à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Seules les factures en brouillon peuvent être modifiées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteApiFacturesBySocieteIdAndId
      tags: [Ventes]
      summary: Supprime une facture en brouillon
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Facture supprimée
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Seules les factures en brouillon peuvent être supprimées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/factures/{societeId}/{id}/valider:
    post:
      operationId: postApiFacturesBySocieteIdAndIdValider
      tags: [Ventes]
      summary: "Confirme la facture (aucune écriture comptable : pas encore émise)"
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Facture validée
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cette facture a déjà été validée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/factures/{societeId}/{id}/facturer:
    post:
      operationId: postApiFacturesBySocieteIdAndIdFacturer
      tags: [Ventes]
      summary: Comptabilise l'émission (débit 411 client / crédit comptes de produit)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date, description: Défaut = aujourd'hui }
      responses:
        '200':
          description: Facture émise et comptabilisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400':
          description: Échec de création de l'écriture (voir la section "Écritures comptables")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La facture doit être validée avant d'être émise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/factures/{societeId}/{id}/encaisser:
    post:
      operationId: postApiFacturesBySocieteIdAndIdEncaisser
      tags: [Ventes]
      summary: Comptabilise l'encaissement (débit trésorerie / crédit 411 client)
      description: Le journal (Caisse `CA` ou Banque `BQ`) est déduit automatiquement selon que `compteTresorerie` commence par `57`.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compteTresorerie]
              properties:
                compteTresorerie: { type: string, example: '521' }
                date: { type: string, format: date, description: Défaut = aujourd'hui }
      responses:
        '200':
          description: Encaissement comptabilisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La facture doit être émise avant l'encaissement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Rapprochement bancaire ────────────────────────────
  /api/rapprochement/{societeId}/{compte}:
    get:
      operationId: getApiRapprochementBySocieteIdAndCompte
      tags: [Rapprochement bancaire]
      summary: Mouvements d'un compte de trésorerie avec solde comptable / pointé / théorique du relevé
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
        - name: dateFin
          in: query
          description: Ne conserve que les mouvements jusqu'à cette date
          schema: { type: string, format: date }
      responses:
        '200':
          description: Mouvements et soldes du compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rapprochement' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/rapprochement/{societeId}/{compte}/pointer:
    post:
      operationId: postApiRapprochementBySocieteIdAndComptePointer
      tags: [Rapprochement bancaire]
      summary: Bascule le pointage d'une ligne
      description: |
        Purement déclaratif — ne modifie jamais le débit/crédit d'une ligne, donc reste
        autorisé même sur un exercice clôturé.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/CompteAuxPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ecritureId, ligneIndex]
              properties:
                ecritureId: { type: string }
                ligneIndex: { type: integer }
                pointe: { type: boolean, default: false }
      responses:
        '200':
          description: Pointage mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400':
          description: ecritureId/ligneIndex manquant, ou ligne invalide pour ce compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Export ────────────────────────────────────────────
  /api/export/{societeId}/fec:
    get:
      operationId: getApiExportBySocieteIdFec
      tags: [Export]
      summary: Génère et télécharge le Fichier des Écritures Comptables (FEC) de l'exercice
      description: |
        Fichier texte tabulé (colonnes inspirées du FEC français), encodé UTF-8 avec BOM,
        exploitable par tout expert-comptable ou tableur. Renvoyé en téléchargement
        (`Content-Disposition: attachment`), pas en JSON.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Fichier FEC (texte tabulé, `.txt`)
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Modèles ───────────────────────────────────────────
  /api/modeles/{societeId}:
    get:
      operationId: getApiModelesBySocieteId
      tags: [Modèles]
      summary: Modèles d'écritures récurrentes de la société, triés par nom
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      responses:
        '200':
          description: Liste des modèles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Modele' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiModelesBySocieteId
      tags: [Modèles]
      summary: Crée un modèle d'écriture récurrente
      description: |
        Validation allégée par rapport à la création directe d'une écriture : un modèle
        peut stocker des lignes à montant 0 (montant variable, saisi à chaque génération).
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeleCreateRequest' }
      responses:
        '201':
          description: Modèle créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Modele' }
        '400':
          description: nom/journalCode manquant, lignes invalides, ou journal inconnu pour cette société
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/modeles/{societeId}/{id}:
    put:
      operationId: putApiModelesBySocieteIdAndId
      tags: [Modèles]
      summary: Modifie un modèle d'écriture
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeleUpdateRequest' }
      responses:
        '200':
          description: Modèle mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400':
          description: Lignes invalides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteApiModelesBySocieteIdAndId
      tags: [Modèles]
      summary: Supprime un modèle d'écriture
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Modèle supprimé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/modeles/{societeId}/{id}/generer:
    post:
      operationId: postApiModelesBySocieteIdAndIdGenerer
      tags: [Modèles]
      summary: Crée une vraie écriture comptabilisée à partir du modèle
      description: |
        `lignes` est optionnel : si omis, les lignes stockées dans le modèle sont utilisées
        telles quelles (utile pour un modèle déjà valorisé) ; sinon les lignes fournies
        remplacent celles du modèle pour cette génération uniquement (utile pour un modèle à
        montants variables). `libelle` par défaut = nom du modèle.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
                libelle: { type: string }
                lignes:
                  type: array
                  items: { $ref: '#/components/schemas/LigneEcritureInput' }
      responses:
        '200':
          description: Écriture générée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400':
          description: date manquante, lignes invalides, ou échec de création de l'écriture (voir la section "Écritures comptables")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Audit Flash ───────────────────────────────────────
  /api/audit-flash/{societeId}:
    get:
      operationId: getApiAuditFlashBySocieteId
      tags: [Audit Flash]
      summary: Croise CA réel encaissé, versements bancaires saisis et charges saisies sur une période
      description: |
        Rapport de lecture seule, à la demande : ne crée ni ne modifie aucune écriture.
        Réservé à la société `cookafrica` (400 sinon) — c'est la seule dont le chiffre
        d'affaires est piloté par une application externe ; pour Ohinéné, les ventes sont
        déjà saisies directement en compta.

        Croise trois sources pour la période `debut`–`fin` :
        - le CA réel encaissé, obtenu par un appel serveur-à-serveur en lecture seule vers
          `GET /api/integration/ca` de **cookafrica-app** (authentifié par clé de service
          `X-Service-Key`, indépendante du JWT de l'utilisateur ERP-Compta qui appelle CET
          endpoint) — seules les factures au statut `payee` y comptent ;
        - les versements bancaires déjà saisis dans ERP-Compta (lignes au débit du compte
          `512` sur la période) ;
        - les charges déjà enregistrées dans ERP-Compta (lignes sur des comptes de classe 6
          sur la période).

        `beneficeReel` = CA − charges. `ecartTresorerie` = CA − versements : un écart notable
        signale un montant non déposé/non justifié à examiner.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: debut
          in: query
          required: true
          schema: { type: string, format: date }
        - name: fin
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rapport Audit Flash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditFlash' }
        '400':
          description: societeId différent de `cookafrica`, ou debut/fin manquant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Échec de lecture en base, ou de l'appel à cookafrica-app (ex. clé de service invalide côté cookafrica-app) — remonté tel quel dans `error`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton obtenu via `POST /api/auth/login`, valable 12h. Embarque `id`, `username`, `nom`, `role` et `societesAccess`.

  parameters:
    SocieteIdPathParam:
      name: societeId
      in: path
      required: true
      description: Identifiant de la société (ex. `ohinene`, `cookafrica`)
      schema: { type: string }
    IdPathParam:
      name: id
      in: path
      required: true
      description: Identifiant du document Firestore
      schema: { type: string }
    NumeroPathParam:
      name: numero
      in: path
      required: true
      description: Numéro de compte du plan comptable (ex. `601`)
      schema: { type: string }
    CompteAuxPathParam:
      name: compte
      in: path
      required: true
      description: Numéro de compte concerné (ex. `411001` pour un client, `512` pour une banque)
      schema: { type: string }

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Non authentifié (token manquant, invalide ou expiré)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Accès refusé (rôle insuffisant, ou société hors `societesAccess`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    Role:
      type: string
      enum: [admin, comptable]

    UserPublic:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        nom: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        societesAccess:
          type: array
          items: { type: string }
          example: [ohinene, cookafrica]

    Societe:
      type: object
      properties:
        id: { type: string, example: ohinene }
        nom: { type: string, example: Hôtel Ohinéné }
        sigle: { type: string, example: OHINENE }
        devise: { type: string, example: XOF }
        exerciceCourant: { type: integer, example: 2026 }
        exercicesClotures:
          type: array
          items: { type: integer }
          description: Exercices déjà clôturés — plus aucune écriture ne peut y être ajoutée

    SocieteUpdateRequest:
      type: object
      properties:
        nom: { type: string }
        sigle: { type: string }
        devise: { type: string }
        exerciceCourant: { type: integer }

    Compte:
      type: object
      properties:
        societeId: { type: string }
        numero: { type: string, example: '601' }
        libelle: { type: string, example: Achats de marchandises }
        classe: { type: integer, minimum: 1, maximum: 8, example: 6 }

    CompteCreateRequest:
      type: object
      required: [numero, libelle, classe]
      properties:
        numero: { type: string }
        libelle: { type: string }
        classe: { type: integer, minimum: 1, maximum: 8 }

    Journal:
      type: object
      properties:
        societeId: { type: string }
        code: { type: string, enum: [AC, VE, BQ, CA, OD, AN] }
        libelle: { type: string, example: Journal des Achats }

    LigneEcriture:
      type: object
      properties:
        compte: { type: string }
        libelle: { type: string }
        debit: { type: number }
        credit: { type: number }
        lettre:
          type: string
          nullable: true
          description: Renseigné une fois la ligne lettrée (voir module Lettrage)
        pointe:
          type: boolean
          description: Renseigné pour une ligne d'un compte de trésorerie (voir module Rapprochement bancaire)

    LigneEcritureInput:
      type: object
      required: [compte]
      description: Une ligne doit être uniquement débitrice ou uniquement créditrice (jamais les deux, jamais nulle).
      properties:
        compte: { type: string }
        libelle: { type: string }
        debit: { type: number, minimum: 0, default: 0 }
        credit: { type: number, minimum: 0, default: 0 }

    Ecriture:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        journalCode: { type: string }
        numero:
          type: integer
          description: Séquentiel par société + journal + exercice
        date: { type: string, format: date }
        exercice: { type: integer }
        libelle: { type: string }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneEcriture' }
        totalDebit: { type: number }
        totalCredit: { type: number }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
        extourneeParId:
          type: string
          nullable: true
          description: Renseigné si cette écriture a été contre-passée
        extourneeLe: { type: string, format: date-time, nullable: true }

    EcritureCreateRequest:
      type: object
      required: [journalCode, date, libelle, exercice, lignes]
      properties:
        journalCode: { type: string, example: OD }
        date: { type: string, format: date }
        libelle: { type: string }
        exercice: { type: integer }
        lignes:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/LigneEcritureInput' }

    GrandLivreLigne:
      type: object
      properties:
        date: { type: string, format: date }
        journalCode: { type: string }
        numero: { type: integer }
        libelle: { type: string }
        debit: { type: number }
        credit: { type: number }
        solde: { type: number, description: Solde progressif après cette ligne }

    GrandLivre:
      type: object
      properties:
        compte: { type: string }
        soldeInitial: { type: number }
        totalDebit: { type: number }
        totalCredit: { type: number }
        soldeFinal: { type: number }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/GrandLivreLigne' }

    BalanceLigne:
      type: object
      properties:
        numero: { type: string }
        libelle: { type: string }
        classe: { type: integer }
        totalDebit: { type: number }
        totalCredit: { type: number }
        soldeDebiteur: { type: number }
        soldeCrediteur: { type: number }

    Balance:
      type: object
      properties:
        lignes:
          type: array
          items: { $ref: '#/components/schemas/BalanceLigne' }
        totaux:
          type: object
          properties:
            totalDebit: { type: number }
            totalCredit: { type: number }
            soldeDebiteur: { type: number }
            soldeCrediteur: { type: number }

    BilanLigne:
      type: object
      properties:
        numero: { type: string }
        libelle: { type: string }
        montant: { type: number }

    Bilan:
      type: object
      properties:
        actif:
          type: array
          items: { $ref: '#/components/schemas/BilanLigne' }
        passif:
          type: array
          items: { $ref: '#/components/schemas/BilanLigne' }
        totalActif: { type: number }
        totalPassif: { type: number }
        equilibre: { type: boolean }

    Resultat:
      type: object
      properties:
        charges:
          type: array
          items: { $ref: '#/components/schemas/BilanLigne' }
        produits:
          type: array
          items: { $ref: '#/components/schemas/BilanLigne' }
        totalCharges: { type: number }
        totalProduits: { type: number }
        resultatNet: { type: number }

    BalanceAuxiliaireLigne:
      type: object
      properties:
        id: { type: string }
        nom: { type: string }
        compteNumero: { type: string }
        totalDebit: { type: number }
        totalCredit: { type: number }
        solde: { type: number }

    BalanceAuxiliaire:
      type: object
      properties:
        lignes:
          type: array
          items: { $ref: '#/components/schemas/BalanceAuxiliaireLigne' }
        totaux:
          type: object
          properties:
            totalDebit: { type: number }
            totalCredit: { type: number }
            solde: { type: number }

    DeclarationTva:
      type: object
      properties:
        dateDebut: { type: string, format: date }
        dateFin: { type: string, format: date }
        tvaCollectee: { type: number }
        tvaDeductible: { type: number }
        tvaNette: { type: number }
        sens: { type: string, enum: [a_payer, credit_a_reporter] }

    Esg:
      type: object
      description: État des Soldes de Gestion — soldes intermédiaires successifs du compte de résultat SYSCOHADA.
      properties:
        exercice: { type: integer }
        ventesMarchandises: { type: number }
        achatsMarchandises: { type: number }
        margeCommerciale: { type: number }
        productionExercice: { type: number }
        achatsEtServicesExterieurs: { type: number }
        valeurAjoutee: { type: number }
        chargesPersonnel: { type: number }
        impotsEtTaxes: { type: number }
        excedentBrutExploitation: { type: number }
        reprisesExploitation: { type: number }
        dotationsExploitation: { type: number }
        autresProduitsExploitation: { type: number }
        resultatExploitation: { type: number }
        produitsFinanciers: { type: number }
        chargesFinancieres: { type: number }
        resultatFinancier: { type: number }
        resultatActivitesOrdinaires: { type: number }
        produitsHAO: { type: number }
        chargesHAO: { type: number }
        resultatHAO: { type: number }
        impotResultat: { type: number }
        resultatNet: { type: number }

    FluxTresorerie:
      type: object
      properties:
        exercice: { type: integer }
        exercicePrecedent: { type: integer }
        resultatNet: { type: number }
        dotationsExploitation: { type: number }
        reprisesExploitation: { type: number }
        cafg: { type: number, description: Capacité d'autofinancement globale }
        variationBfr: { type: number }
        fluxExploitation: { type: number }
        fluxInvestissement: { type: number }
        fluxFinancement: { type: number }
        variationTresorerieCalculee: { type: number }
        variationTresorerieBilan: { type: number }
        ecartControle: { type: number, description: Écart entre la variation calculée et la variation constatée au bilan — devrait être proche de 0 }

    Employe:
      type: object
      description: Schéma défini et maintenu par App-Gestion-Employees ; champs ci-dessous observés dans l'usage côté ERP-Compta.
      properties:
        employeId: { type: string }
        nom: { type: string }
        matricule: { type: string }
        poste: { type: string }
        etablissementsAccess:
          type: array
          items: { type: string }
          description: Sociétés/établissements auxquels cet employé est rattaché — sert au filtrage par `societesAccess` côté ERP-Compta

    Pointage:
      type: object
      description: Schéma défini et maintenu par App-Gestion-Employees (pointage QR).

    FichePaie:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        employeId: { type: string }
        employeNom: { type: string }
        matricule: { type: string }
        poste: { type: string }
        periode: { type: string, example: '2026-08' }
        heuresPointees: { type: number }
        heuresCongesPayees: { type: number }
        totalHeures: { type: number }
        heuresAttenduesMois: { type: number }
        salaireMensuelBase: { type: number }
        salaireBrutCalcule: { type: number }
        avanceDeduite: { type: number }
        salaireNet: { type: number }
        statut: { type: string, enum: [brouillon, validee, payee] }
        ecritureId: { type: string, nullable: true }
        ecriturePaiementId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Tiers:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        type: { type: string, enum: [client, fournisseur] }
        nom: { type: string }
        compteNumero: { type: string, description: Compte auxiliaire généré automatiquement (411xxx ou 401xxx) }
        telephone: { type: string }
        email: { type: string }
        adresse: { type: string }
        actif: { type: boolean }
        createdAt: { type: string, format: date-time }

    TiersCreateRequest:
      type: object
      required: [type, nom]
      properties:
        type: { type: string, enum: [client, fournisseur] }
        nom: { type: string }
        telephone: { type: string }
        email: { type: string }
        adresse: { type: string }

    TiersUpdateRequest:
      type: object
      properties:
        nom: { type: string }
        telephone: { type: string }
        email: { type: string }
        adresse: { type: string }

    LigneMontant:
      type: object
      properties:
        compte: { type: string }
        libelle: { type: string }
        montant: { type: number }

    LigneMontantInput:
      type: object
      required: [compte, montant]
      properties:
        compte: { type: string }
        libelle: { type: string }
        montant: { type: number, exclusiveMinimum: 0 }

    StatutBonCommande:
      type: string
      enum: [brouillon, validee, recue, payee]

    BonCommande:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        numero: { type: string, example: BC-0001 }
        fournisseurId: { type: string }
        fournisseurNom: { type: string }
        fournisseurCompte: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneMontant' }
        montantTotal: { type: number }
        statut: { $ref: '#/components/schemas/StatutBonCommande' }
        ecritureReceptionId: { type: string, nullable: true }
        ecriturePaiementId: { type: string, nullable: true }
        dateReception: { type: string, format: date }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    BonCommandeCreateRequest:
      type: object
      required: [fournisseurId, date, lignes]
      properties:
        fournisseurId: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LigneMontantInput' }

    BonCommandeUpdateRequest:
      type: object
      properties:
        fournisseurId: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneMontantInput' }

    ClotureApercu:
      type: object
      properties:
        exercice: { type: integer }
        exerciceSuivant: { type: integer }
        totalCharges: { type: number }
        totalProduits: { type: number }
        resultatNet: { type: number }
        compteResultat:
          type: string
          nullable: true
          description: '`120` (bénéfice) ou `129` (perte), null si résultat nul'
        lignesResultat:
          type: array
          items: { $ref: '#/components/schemas/LigneEcriture' }
        lignesANouveaux:
          type: array
          items: { $ref: '#/components/schemas/LigneEcriture' }
        totalANDebit: { type: number }
        totalANCredit: { type: number }

    ClotureResultat:
      type: object
      properties:
        message: { type: string }
        exercice: { type: integer }
        exerciceSuivant: { type: integer }
        resultatNet: { type: number }
        compteResultat: { type: string, nullable: true }
        ecritureClotureId: { type: string, nullable: true }
        ecritureAnId: { type: string, nullable: true }

    MouvementLettrage:
      type: object
      properties:
        ecritureId: { type: string }
        ligneIndex: { type: integer }
        date: { type: string, format: date }
        journalCode: { type: string }
        numero: { type: integer }
        libelle: { type: string }
        debit: { type: number }
        credit: { type: number }
        lettre: { type: string, nullable: true }

    StatutFactureVente:
      type: string
      enum: [brouillon, validee, facturee, encaissee]

    FactureVente:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        numero: { type: string, example: FV-0001 }
        clientId: { type: string }
        clientNom: { type: string }
        clientCompte: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneMontant' }
        montantTotal: { type: number }
        statut: { $ref: '#/components/schemas/StatutFactureVente' }
        ecritureFactureId: { type: string, nullable: true }
        ecritureEncaissementId: { type: string, nullable: true }
        dateFacture: { type: string, format: date }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    FactureVenteCreateRequest:
      type: object
      required: [clientId, date, lignes]
      properties:
        clientId: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/LigneMontantInput' }

    FactureVenteUpdateRequest:
      type: object
      properties:
        clientId: { type: string }
        date: { type: string, format: date }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneMontantInput' }

    MouvementRapprochement:
      type: object
      properties:
        ecritureId: { type: string }
        ligneIndex: { type: integer }
        date: { type: string, format: date }
        journalCode: { type: string }
        numero: { type: integer }
        libelle: { type: string }
        debit: { type: number }
        credit: { type: number }
        pointe: { type: boolean }

    Rapprochement:
      type: object
      properties:
        mouvements:
          type: array
          items: { $ref: '#/components/schemas/MouvementRapprochement' }
        soldeComptable: { type: number }
        soldeNonPointe: { type: number }
        soldeTheoriqueReleve: { type: number, description: soldeComptable − soldeNonPointe }

    Modele:
      type: object
      properties:
        id: { type: string }
        societeId: { type: string }
        nom: { type: string }
        journalCode: { type: string }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneEcriture' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    ModeleCreateRequest:
      type: object
      required: [nom, journalCode, lignes]
      properties:
        nom: { type: string }
        journalCode: { type: string }
        lignes:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/LigneEcritureInput' }

    ModeleUpdateRequest:
      type: object
      properties:
        nom: { type: string }
        journalCode: { type: string }
        lignes:
          type: array
          items: { $ref: '#/components/schemas/LigneEcritureInput' }

    AuditFlashMouvement:
      type: object
      properties:
        date: { type: string, format: date }
        journalCode: { type: string }
        numero: { type: integer }
        libelle: { type: string }
        montant: { type: number }

    AuditFlashCharge:
      type: object
      properties:
        date: { type: string, format: date }
        journalCode: { type: string }
        numero: { type: integer }
        compte: { type: string }
        compteLibelle: { type: string }
        libelle: { type: string }
        montant: { type: number }

    AuditFlash:
      type: object
      properties:
        debut: { type: string, format: date }
        fin: { type: string, format: date }
        chiffreAffaires: { type: number, description: Total des factures payées côté cookafrica-app sur la période }
        chiffreAffairesParMode:
          type: object
          additionalProperties: { type: number }
          example: { especes: 2685000, carte: 298500 }
        nombreFactures: { type: integer }
        versements: { type: number, description: Somme des débits du compte 512 saisis dans ERP-Compta sur la période }
        versementsDetail:
          type: array
          items: { $ref: '#/components/schemas/AuditFlashMouvement' }
        charges: { type: number, description: Somme nette (débit − crédit) des lignes sur comptes de classe 6 saisies dans ERP-Compta sur la période }
        chargesDetail:
          type: array
          items: { $ref: '#/components/schemas/AuditFlashCharge' }
        beneficeReel: { type: number, description: chiffreAffaires − charges }
        ecartTresorerie: { type: number, description: chiffreAffaires − versements — un écart notable signale un montant non déposé/non justifié }