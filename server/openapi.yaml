            schema: { $ref: '#/components/schemas/BonCommandeCreateRequest' }
      responses:
        '201':
          description: Bon de commande créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonCommande' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/commandes/{societeId}/{id}:
    get:
      operationId: getApiCommandesBySocieteIdAndId
      tags: [Achats]
      summary: Détail d'un bon de commande
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Bon de commande
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonCommande' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putApiCommandesBySocieteIdAndId
      tags: [Achats]
      summary: Modifie un bon de commande en brouillon
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
