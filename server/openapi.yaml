      tags: [Rapports]
      summary: État des Soldes de Gestion (SYSCOHADA)
      description: |
        Adapté au plan comptable réduit de cette application (pas de compte de variation de
        stock ni de production stockée/immobilisée : ces lignes restent à 0 par construction).
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
        - name: dateDebut
          in: query
          schema: { type: string, format: date }
        - name: dateFin
          in: query
          schema: { type: string, format: date }
