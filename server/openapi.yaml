          in: query
          schema: { type: string, enum: [client, fournisseur] }
      responses:
        '200':
          description: Liste des tiers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tiers' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiTiersBySocieteId
      tags: [Tiers]
      summary: Crée un tiers et son compte auxiliaire dans le plan comptable
      description: |
        Le numéro de compte auxiliaire est généré automatiquement (`411xxx` pour un client,
        `401xxx` pour un fournisseur) et ajouté au plan comptable de la société.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TiersCreateRequest' }
      responses:
        '201':
          description: Tiers créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tiers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tiers/{societeId}/{id}:
    put:
      operationId: putApiTiersBySocieteIdAndId
      tags: [Tiers]
      summary: Modifie un tiers
      description: Un changement de `nom` répercute aussi le libellé du compte auxiliaire associé dans le plan comptable.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TiersUpdateRequest' }
      responses:
        '200':
          description: Tiers mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteApiTiersBySocieteIdAndId
      tags: [Tiers]
      summary: Supprime un tiers et son compte auxiliaire
      description: Refusé si le compte auxiliaire a des mouvements dans des écritures existantes.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Tiers supprimé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ce compte est utilisé dans des écritures
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Achats ────────────────────────────────────────────
  /api/commandes/{societeId}:
    get:
      operationId: getApiCommandesBySocieteId
