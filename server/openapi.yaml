  /api/rapports/{societeId}/flux-tresorerie:
    get:
      operationId: getApiRapportsBySocieteIdFluxTresorerie
      tags: [Rapports]
      summary: Tableau des flux de trésorerie simplifié (méthode indirecte, inspiré du TAFIRE)
      description: |
        Compare l'exercice demandé à l'exercice précédent pour reconstituer les flux
        d'exploitation, d'investissement et de financement. À considérer comme indicatif,
        pas comme le TAFIRE normalisé complet (qui détaille des sous-catégories que le plan
        comptable réduit de cette appli ne distingue pas).
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Flux de trésorerie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FluxTresorerie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── Personnel / Pointages ─────────────────────────────
  /api/employes:
    get:
      operationId: getApiEmployes
      tags: [Personnel]
      summary: Liste des employés
      description: |
        Source de vérité : App-Gestion-Employees (appel serveur-à-serveur en lecture seule).
        La création/modification des employés se fait exclusivement dans cette autre
        application. Un `comptable` ne voit que les employés dont un établissement figure
        dans son `societesAccess`.
      parameters:
        - name: etablissement
          in: query
          description: Filtre transmis tel quel à App-Gestion-Employees
          schema: { type: string }
      responses:
        '200':
          description: Liste des employés (schéma défini par App-Gestion-Employees)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Employe' }
        '502':
          description: App-Gestion-Employees indisponible ou en erreur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/pointages/{societeId}:
    get:
      operationId: getApiPointagesBySocieteId
      tags: [Pointages]
      summary: Pointages réels (scan QR) de la société
      description: |
        Lecture seule — source de vérité App-Gestion-Employees. Plus de saisie/correction
        manuelle des pointages côté ERP-Compta.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: periode
          in: query
          description: Format `YYYY-MM`
          schema: { type: string, example: '2026-08' }
      responses:
        '200':
          description: Liste des pointages (schéma défini par App-Gestion-Employees)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pointage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: App-Gestion-Employees indisponible ou en erreur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Paie ──────────────────────────────────────────────
  /api/paie/{societeId}:
    get:
      operationId: getApiPaieBySocieteId
      tags: [Paie]
      summary: Fiches de paie de la société, triées par période décroissante puis nom
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: periode
          in: query
          description: Format `YYYY-MM`
          schema: { type: string, example: '2026-08' }
      responses:
        '200':
          description: Liste des fiches de paie
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FichePaie' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/paie/{societeId}/{id}:
    get:
      operationId: getApiPaieBySocieteIdAndId
      tags: [Paie]
      summary: Détail d'une fiche de paie (pour affichage du bulletin)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Fiche de paie et société associée
          content:
            application/json:
              schema:
                type: object
                properties:
                  fiche: { $ref: '#/components/schemas/FichePaie' }
                  societe: { $ref: '#/components/schemas/Societe' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteApiPaieBySocieteIdAndId
      tags: [Paie]
      summary: Supprime une fiche de paie en brouillon
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Fiche supprimée
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Seules les fiches en brouillon peuvent être supprimées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/paie/{societeId}/generer:
    post:
      operationId: postApiPaieBySocieteIdGenerer
      tags: [Paie]
      summary: Génère les fiches de paie brouillon de la période
      description: |
        Calcul officiel délégué à App-Gestion-Employees (pointages réels + congés payés +
        avances). Ignore silencieusement les employés qui ont déjà une fiche pour cette
        période — répond alors `fiches: []` avec un message explicite plutôt qu'une erreur.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periode]
              properties:
                periode: { type: string, example: '2026-08', description: Format YYYY-MM }
      responses:
        '200':
          description: Fiches générées (ou aucune à générer — voir `message`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  fiches:
                    type: array
                    items: { $ref: '#/components/schemas/FichePaie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502':
          description: App-Gestion-Employees indisponible ou en erreur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/paie/{societeId}/{id}/valider:
    post:
      operationId: postApiPaieBySocieteIdAndIdValider
      tags: [Paie]
      summary: Comptabilise la charge de salaire brut (débit 661 / crédit 422)
      description: |
        L'avance déduite (si applicable) reste une information RH affichée sur le bulletin,
        sans écriture comptable dédiée à ce stade (décision explicite, pour ne pas
        introduire un compte d'avances jamais débité à l'origine côté compta).
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Fiche validée et comptabilisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400':
          description: Échec de création de l'écriture (voir la section "Écritures comptables")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cette fiche a déjà été validée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/paie/{societeId}/{id}/payer:
    post:
      operationId: postApiPaieBySocieteIdAndIdPayer
      tags: [Paie]
      summary: Comptabilise le paiement du salaire (débit 422 / crédit trésorerie)
      description: |
        `compteTresorerie` requis — le journal (Caisse `CA` ou Banque `BQ`) est déduit
        automatiquement selon que ce compte commence par `57`. Si `avanceDeduite > 0`,
        notifie aussi App-Gestion-Employees pour solder l'avance côté RH.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [compteTresorerie]
              properties:
                compteTresorerie: { type: string, example: '571' }
                date: { type: string, format: date, description: Défaut = dernier jour du mois de la période }
      responses:
        '200':
          description: Paiement comptabilisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: La fiche doit être validée avant le paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Échec de la mise à jour du solde d'avance côté App-Gestion-Employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Tiers ─────────────────────────────────────────────
  /api/tiers/{societeId}:
    get:
      operationId: getApiTiersBySocieteId
      tags: [Tiers]
      summary: Tiers (clients et/ou fournisseurs) de la société, triés par nom
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
