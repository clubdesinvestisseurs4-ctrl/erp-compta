openapi: 3.0.3
info:
  title: ERP Compta API
  description: |
    API backend de l'ERP de comptabilité générale SYSCOHADA multi-société, pour l'Hôtel
    Ohinéné et Cook Africa (sociétés `ohinene` et `cookafrica`).

    ### Authentification
    La quasi-totalité des routes exigent un JWT Bearer obtenu via `POST /api/auth/login`,
    envoyé dans l'en-tête `Authorization: Bearer <token>`. Le token expire après 12h et
    embarque `societesAccess` (liste des sociétés autorisées).

    Exception notable : `POST /api/auth/seed` et `POST /api/societes/seed` ne portent
    **aucune protection** côté serveur (ni JWT, ni jeton dédié) — ils sont seulement
    bloqués une fois les données déjà initialisées (409). Prévus pour un usage unique en
    tout début de déploiement.

    ### Rôles et accès société
    Deux rôles : `admin` et `comptable`. `admin` a accès à toutes les sociétés et à toutes
    les routes réservées (ex: exécution de clôture) ; `comptable` est restreint aux sociétés
    listées dans `societesAccess` de son compte.

    Sur toute route au format `/api/<module>/{societeId}/...`, le middleware
    `requireSocieteAccess` vérifie que l'utilisateur a accès à `societeId` — 403 sinon
    (401 si pas de token du tout, 403 si token valide mais société/rôle non autorisé).

    ### Intégrations sortantes (lecture seule, pas exposées directement aux clients)
    Certaines routes agrègent des données d'autres applications internes via un client
    serveur-à-serveur authentifié par clé partagée (`X-Service-Key`), toujours en plus de
    l'authentification JWT normale côté client ERP-Compta (l'appel sortant est invisible du
    consommateur de cette API) :
    - `App-Gestion-Employees` (source de vérité personnel/pointage/paie) : `GET /api/employes`,
      `GET /api/pointages/{societeId}`, `POST /api/paie/{societeId}/generer`,
      `POST /api/paie/{societeId}/{id}/payer`.
    - `cookafrica-app`, endpoint `GET /api/integration/ca` (source de vérité du chiffre
      d'affaires réel encaissé) : `GET /api/audit-flash/{societeId}`, réservé à la société
      `cookafrica`.

    Si l'application externe appelée est indisponible ou renvoie une erreur, ces routes
    répondent **502** avec le message d'erreur remonté (sauf Audit Flash, qui répond 500 —
    voir la description de cet endpoint).

    ### Écritures comptables
    Une écriture doit comporter au moins 2 lignes, chacune uniquement débitrice ou
    créditrice (jamais les deux, jamais nulle, jamais négative), et le total des débits doit
    égaler le total des crédits. Une écriture ne peut être ajoutée à un exercice déjà
    clôturé (`exercicesClotures` de la société). Une écriture comptabilisée ne se corrige
    jamais sur ses lignes/montants une fois créée : seul son libellé est modifiable
    (`PUT /api/ecritures/{societeId}/{id}`), toute annulation d'effet passe par une
    contre-passation (`POST /api/ecritures/{societeId}/{id}/extourner`).

    ### Erreurs
    Toutes les erreurs suivent le même format `{ "error": "message" }` (parfois complété
    d'un tableau `details` pour les imports), avec le code HTTP approprié (400 validation,
    401 non authentifié, 403 accès refusé, 404 introuvable, 409 conflit, 502 dépendance
    externe indisponible, 500 erreur serveur).
  version: 1.0.0
  contact:
    name: ERP Compta
externalDocs:
  description: README du dépôt
  url: https://github.com/clubdesinvestisseurs4-ctrl/erp-compta

servers:
  - url: https://erp-compta-api-541617482949.us-central1.run.app
    description: Production (Cloud Run)
  - url: http://localhost:3002
    description: Développement local

tags:
  - name: Auth
    description: Connexion et session de l'utilisateur comptable
  - name: Sociétés
    description: Sociétés gérées par l'ERP (Ohinéné, Cook Africa)
  - name: Plan comptable
    description: Comptes SYSCOHADA par société — référentiel, import Excel, gestion manuelle
  - name: Journaux
    description: Journaux comptables par société (Achats, Ventes, Banque, Caisse, OD, À-Nouveaux)
  - name: Écritures
    description: Saisie, consultation et contre-passation des écritures comptables
  - name: Rapports
    description: Grand livre, balance, bilan, compte de résultat, TVA, ESG, flux de trésorerie
  - name: Personnel
    description: Employés (lecture seule, source de vérité App-Gestion-Employees)
  - name: Pointages
    description: Pointages réels par QR code (lecture seule, source de vérité App-Gestion-Employees)
  - name: Paie
    description: Fiches de paie — génération, validation et paiement comptabilisés
  - name: Tiers
    description: Clients et fournisseurs, avec leur compte auxiliaire dans le plan comptable
  - name: Achats
    description: Bons de commande fournisseurs — brouillon, validation, réception, paiement
  - name: Ventes
    description: Factures de vente clients — brouillon, validation, émission, encaissement
  - name: Clôture
    description: Clôture d'exercice comptable (résultat + à-nouveaux)
  - name: Lettrage
    description: Lettrage des mouvements d'un compte (manuel ou automatique)
  - name: Rapprochement bancaire
    description: Pointage des mouvements d'un compte de trésorerie face à un relevé
  - name: Export
    description: Export du Fichier des Écritures Comptables (FEC)
  - name: Modèles
    description: Modèles d'écritures récurrentes
  - name: Audit Flash
    description: Croisement CA réel / versements / charges pour Cook Africa (lecture seule)
  - name: Système
    description: Health check

security:
  - bearerAuth: []

paths:

  /health:
    get:
      operationId: getHealth
      tags: [Système]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  timestamp: { type: string, format: date-time }
                  service: { type: string, example: ERP Compta API }

  # ── Auth ──────────────────────────────────────────────
  /api/auth/login:
    post:
      operationId: postApiAuthLogin
      tags: [Auth]
      summary: Connexion
      description: Limité à 10 tentatives / 15 min par IP (rate limit global sur cette route).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/UserPublic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      operationId: getApiAuthMe
      tags: [Auth]
      summary: Informations sur l'utilisateur connecté (contenu décodé du JWT)
      responses:
        '200':
          description: Utilisateur courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/UserPublic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/seed:
    post:
      operationId: postApiAuthSeed
      tags: [Auth]
      summary: Crée les 2 comptes staff par défaut, admin et comptable (une seule fois)
      description: |
        Aucune authentification requise — à appeler une seule fois en tout début de
        déploiement. Le comptable auto-échoue si des utilisateurs existent déjà en base.
      security: []
      responses:
        '200':
          description: Utilisateurs créés
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count: { type: integer, example: 2 }
        '409':
          description: Base déjà initialisée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Sociétés ──────────────────────────────────────────
  /api/societes:
    get:
      operationId: getApiSocietes
      tags: [Sociétés]
      summary: Sociétés accessibles à l'utilisateur connecté
      description: Un `admin` voit toutes les sociétés ; un `comptable` ne voit que celles listées dans `societesAccess`.
      responses:
        '200':
          description: Liste des sociétés
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Societe' }

  /api/societes/seed:
    post:
      operationId: postApiSocietesSeed
      tags: [Sociétés]
      summary: Crée les sociétés par défaut, Ohinéné et Cook Africa (une seule fois)
      description: Aucune authentification requise — à appeler une seule fois en tout début de déploiement.
      security: []
      responses:
        '200':
          description: Sociétés créées
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count: { type: integer, example: 2 }
        '409':
          description: Sociétés déjà initialisées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/societes/{id}:
    put:
      operationId: putApiSocietesById
      tags: [Sociétés]
      summary: Modifier une société (admin uniquement)
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant de la société (ex. `ohinene`, `cookafrica`)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocieteUpdateRequest' }
      responses:
        '200':
          description: Société mise à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Plan comptable ────────────────────────────────────
  /api/comptes/{societeId}:
    get:
      operationId: getApiComptesBySocieteId
      tags: [Plan comptable]
      summary: Plan comptable de la société, trié par numéro
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      responses:
        '200':
          description: Liste des comptes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Compte' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiComptesBySocieteId
      tags: [Plan comptable]
      summary: Ajoute un compte spécifique à la société
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompteCreateRequest' }
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Ce compte existe déjà
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/comptes/{societeId}/seed:
    post:
      operationId: postApiComptesBySocieteIdSeed
      tags: [Plan comptable]
      summary: Copie le référentiel SYSCOHADA complet pour la société
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      responses:
        '200':
          description: Plan comptable initialisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Plan comptable déjà initialisé pour cette société
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/comptes/{societeId}/import:
    post:
      operationId: postApiComptesBySocieteIdImport
      tags: [Plan comptable]
      summary: Importe un plan comptable spécifique depuis un fichier Excel (.xlsx)
      description: |
        Colonnes attendues en première ligne : Numéro, Libellé, Classe (optionnelle, déduite
        du 1er chiffre du numéro sinon). Les comptes du fichier sont créés ou mis à jour
        (libellé/classe) ; les comptes existants absents du fichier sont conservés.
        Fichier limité à 2 Mo.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [fichier]
              properties:
                fichier:
                  type: string
                  format: binary
                  description: Fichier .xlsx, 2 Mo maximum
      responses:
        '200':
          description: Plan comptable importé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count: { type: integer }
        '400':
          description: Fichier manquant, trop volumineux, illisible, ou contenant des lignes invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  details:
                    type: array
                    description: Présent si le fichier contient des lignes invalides — un message par ligne fautive
                    items: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/comptes/{societeId}/{numero}:
    put:
      operationId: putApiComptesBySocieteIdAndNumero
      tags: [Plan comptable]
      summary: Modifie le libellé d'un compte
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/NumeroPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libelle]
              properties:
                libelle: { type: string }
      responses:
        '200':
          description: Compte mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteApiComptesBySocieteIdAndNumero
      tags: [Plan comptable]
      summary: Supprime un compte du plan comptable
      description: Aucune vérification d'usage dans des écritures n'est effectuée côté serveur pour cette route (contrairement à `DELETE /api/tiers/{societeId}/{id}`).
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/NumeroPathParam'
      responses:
        '200':
          description: Compte supprimé
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Journaux ──────────────────────────────────────────
  /api/journaux/{societeId}:
    get:
      operationId: getApiJournauxBySocieteId
      tags: [Journaux]
      summary: Journaux de la société, triés par code
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      responses:
        '200':
          description: Liste des journaux
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Journal' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/journaux/{societeId}/seed:
    post:
      operationId: postApiJournauxBySocieteIdSeed
      tags: [Journaux]
      summary: Crée les 6 journaux par défaut pour la société (AC, VE, BQ, CA, OD, AN)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      responses:
        '200':
          description: Journaux créés
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  count: { type: integer, example: 6 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Journaux déjà initialisés pour cette société
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Écritures ─────────────────────────────────────────
  /api/ecritures/{societeId}:
    get:
      operationId: getApiEcrituresBySocieteId
      tags: [Écritures]
      summary: Écritures de la société, triées par date décroissante puis numéro décroissant
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: journal
          in: query
          description: Filtre sur le code journal (ex. `AC`)
          schema: { type: string }
        - name: exercice
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Liste des écritures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ecriture' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postApiEcrituresBySocieteId
      tags: [Écritures]
      summary: Crée une écriture comptable
      description: |
        `journalCode`, `date`, `libelle` et `exercice` sont requis. Voir la section
        "Écritures comptables" de la description générale pour les règles de validation
        des lignes — toute violation (déséquilibre, journal ou compte inconnu, exercice
        clôturé, etc.) renvoie **400** avec le message d'erreur précis.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EcritureCreateRequest' }
      responses:
        '201':
          description: Écriture créée et numérotée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ecriture' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/ecritures/{societeId}/{id}:
    get:
      operationId: getApiEcrituresBySocieteIdAndId
      tags: [Écritures]
      summary: Détail d'une écriture
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Écriture
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ecriture' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putApiEcrituresBySocieteIdAndId
      tags: [Écritures]
      summary: Modifie uniquement le libellé d'une écriture
      description: |
        Une écriture comptabilisée ne se corrige jamais sur ses lignes/montants : voir
        `POST /{id}/extourner` pour annuler son effet.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libelle]
              properties:
                libelle: { type: string }
      responses:
        '200':
          description: Libellé mis à jour
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: L'exercice de l'écriture est clôturé — elle est verrouillée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/ecritures/{societeId}/{id}/extourner:
    post:
      operationId: postApiEcrituresBySocieteIdAndIdExtourner
      tags: [Écritures]
      summary: Contre-passation — crée une écriture miroir (débit/crédit inversés)
      description: |
        Seul moyen d'annuler l'effet d'une écriture existante. Marque l'originale comme
        extournée (`extourneeParId`) ; `date` (défaut aujourd'hui) et `journalCode` (défaut
        le journal de l'écriture d'origine) sont optionnels.
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date: { type: string, format: date }
                journalCode: { type: string }
      responses:
        '200':
          description: Écriture extournée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  ecritureId: { type: string }
        '400':
          description: Échec de création de l'écriture miroir (ex. exercice de la date d'extourne clôturé)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cette écriture a déjà été extournée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Rapports ──────────────────────────────────────────
  /api/rapports/{societeId}/grand-livre:
    get:
      operationId: getApiRapportsBySocieteIdGrandLivre
      tags: [Rapports]
      summary: Grand livre d'un compte (mouvements + solde progressif)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: compte
          in: query
          required: true
          schema: { type: string }
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
        - name: dateDebut
          in: query
          description: Restreint l'affichage des mouvements à partir de cette date (le solde initial cumule tout ce qui précède)
          schema: { type: string, format: date }
        - name: dateFin
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Grand livre du compte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrandLivre' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/rapports/{societeId}/balance:
    get:
      operationId: getApiRapportsBySocieteIdBalance
      tags: [Rapports]
      summary: Balance générale des comptes mouvementés sur la période
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
        - name: dateDebut
          in: query
          schema: { type: string, format: date }
        - name: dateFin
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Balance générale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Balance' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/rapports/{societeId}/bilan:
    get:
      operationId: getApiRapportsBySocieteIdBilan
      tags: [Rapports]
      summary: Bilan — Actif / Passif (comptes de classes 1 à 5)
      parameters:
        - $ref: '#/components/parameters/SocieteIdPathParam'
        - name: exercice
          in: query
          required: true
          schema: { type: integer }
